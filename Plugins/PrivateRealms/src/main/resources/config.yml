# PrivateRealms config

hub-world: world           # world name of your hub
template-world: template  # template world name to copy from when creating realms
realms-folder: private_realms  # folder relative to server root where realm worlds are stored
max-players-per-realm: 4
auto-unload-when-empty: true

# scoreboard
scoreboard:
  update-interval-ticks: 100

# autosave data.yml interval
autosave-interval-ticks: 1200
